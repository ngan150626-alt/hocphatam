<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Speaking Practice - Shopping (Grade 8)</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-color: #ffffff;
            --text-dark: #2c3e50;
            --assistant-color: #3498db;
            --student-color: #2ecc71;
            --accent-color: #e67e22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-color);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            color: var(--assistant-color);
            margin-top: 0;
            margin-bottom: 10px;
        }

        .image-display {
            width: 100%;
            height: 200px;
            background-color: #eaeaea;
            border-radius: 15px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ddd;
        }

        .image-display img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out;
        }

        .scenario-box {
            background-color: #e8f4fd;
            border-left: 5px solid var(--assistant-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .chat-box {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            background-color: #fafbfc;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.3;
            font-size: 15px;
        }

        .assistant-msg {
            background-color: var(--assistant-color);
            color: white;
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .student-msg {
            background-color: var(--student-color);
            color: white;
            margin-left: auto;
            border-top-right-radius: 2px;
        }

        .translation {
            font-size: 11px;
            display: block;
            opacity: 0.8;
            margin-top: 3px;
        }

        .hint-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .hint-title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .suggestions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            color: #533f03;
        }

        .controls {
            text-align: center;
        }

        .btn-mic {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
            transition: all 0.3s;
        }

        .btn-mic:hover {
            transform: translateY(-2px);
        }

        .btn-mic.recording {
            background-color: #c0392b;
            animation: pulse 1.5s infinite;
        }

        .btn-reset {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 7px 12px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 English Speaking: Shopping (Grade 8)</h1>

    <div class="image-display" id="imageDisplay">
        <img id="sceneImage" src="" alt="Scene loading...">
    </div>
    
    <div class="scenario-box">
        <strong>Bối cảnh:</strong> Học sinh đi mua một chiếc áo phông (T-shirt) tại cửa hàng. Hãy nghe nhân viên nói và trả lời bằng tiếng Anh nhé!
    </div>

    <div class="chat-box" id="chatBox">
        </div>

    <div class="hint-box">
        <div class="hint-title">💡 Gợi ý (Bạn có thể nói 1 trong các câu sau):</div>
        <div class="suggestions" id="suggestionBox">
            Đang tải gợi ý...
        </div>
    </div>

    <div class="controls">
        <button class="btn-mic" id="micBtn">🎙️ Nhấn và Nói</button>
        <br>
        <button class="btn-reset" onclick="startConversation()">🔄 Thực hành lại từ đầu</button>
    </div>
</div>

<script>
    // Kịch bản hội thoại tích hợp hình ảnh cụ thể cho từng bước (Đã đổi sang đuôi .PNG viết hoa)
    const conversationSteps = [
        {
            step: 0,
            imageUrl: "images/1.png",
            assistantText: "Hello! Welcome to our shop. How can I help you today?",
            assistantVi: "Xin chào! Chào mừng đến cửa hàng. Tôi có thể giúp gì cho bạn hôm nay?",
            hints: [
                "I am looking for a T-shirt. (Mình đang tìm một chiếc áo phông.)",
                "Hello, do you have any T-shirts? (Xin chào, ở đây có áo phông không ạ?)"
            ]
        },
        {
            step: 1,
            imageUrl: "images/2.png",
            assistantText: "Sure! We have many T-shirts here. What color do you like?",
            assistantVi: "Chắc chắn rồi! Chúng tôi có rất nhiều áo phông ở đây. Bạn thích màu gì?",
            hints: [
                "I like blue. (Mình thích màu xanh dương.)",
                "Do you have a white T-shirt? (Bạn có áo phông màu trắng không?)"
            ]
        },
        {
            step: 2,
            imageUrl: "images/3.png",
            assistantText: "Yes, we do. Here is a nice one. What size are you?",
            assistantVi: "Có chứ. Đây là một chiếc rất đẹp. Bạn mặc size gì?",
            hints: [
                "Size M, please. (Cho mình size M nhé.)",
                "I think I need a medium size. (Mình nghĩ mình cần size M/vừa.)"
            ]
        },
        {
            step: 3,
            imageUrl: "images/4.png",
            assistantText: "Here you are. You can try it on. How does it fit?",
            assistantVi: "Của bạn đây. Bạn có thể mặc thử. Nó có vừa vặn không?",
            hints: [
                "It fits perfectly. How much is it? (Nó vừa vặn hoàn hảo luôn. Bao nhiêu tiền thế ạ?)",
                "It is a bit big, but I like it. How much? (Nó hơi rộng một chút nhưng mình thích. Bao nhiêu tiền?)"
            ]
        },
        {
            step: 4,
            imageUrl: "images/5.png",
            assistantText: "It is 15 dollars. Would you like to pay by cash or card?",
            assistantVi: "Nó có giá 15 đô la. Bạn muốn trả bằng tiền mặt hay thẻ?",
            hints: [
                "By cash, please. Here you go. (Bằng tiền mặt nhé. Tiền đây ạ.)",
                "I will pay by card. (Mình sẽ thanh toán bằng thẻ.)"
            ]
        },
        {
            step: 5,
            imageUrl: "images/6.png",
            assistantText: "Thank you very much! Have a wonderful day!",
            assistantVi: "Cảm ơn bạn rất nhiều! Chúc bạn một ngày tuyệt vời!",
            hints: [
                "Thank you! Goodbye! (Cảm ơn bạn! Tạm biệt!)",
                "Goodbye! (Tạm biệt!)"
            ]
        }
    ];

    let currentStep = 0;
    const chatBox = document.getElementById('chatBox');
    const suggestionBox = document.getElementById('suggestionBox');
    const micBtn = document.getElementById('micBtn');
    const sceneImage = document.getElementById('sceneImage');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if (recognition) {
        recognition.lang = 'en-US';
        recognition.interimResults = false;
    }

    function startConversation() {
        chatBox.innerHTML = '';
        currentStep = 0;
        showAssistantMessage();
    }

    function showAssistantMessage() {
        if (currentStep >= conversationSteps.length) {
            chatBox.innerHTML += `<div style="text-align:center; color:#2ecc71; font-weight:bold; margin-top:10px;">🎉 Hoàn thành bài hội thoại!</div>`;
            suggestionBox.innerHTML = "Chúc mừng học sinh đã hoàn thành!";
            sceneImage.src = "images/6.PNG";
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
        }

        const data = conversationSteps[currentStep];
        
        sceneImage.style.opacity = 0;
        setTimeout(() => {
            sceneImage.src = data.imageUrl;
            sceneImage.style.opacity = 1;
        }, 100);

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message assistant-msg';
        msgDiv.innerHTML = `${data.assistantText} <span class="translation">(${data.assistantVi})</span>`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        suggestionBox.innerHTML = data.hints.map(hint => `• ${hint}`).join('<br>');

        speak(data.assistantText);
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }
    }

    let isRecording = false;
    if (recognition) {
        micBtn.addEventListener('click', () => {
            if (currentStep >= conversationSteps.length) return;
            if (!isRecording) {
                recognition.start();
            } else {
                recognition.stop();
            }
        });

        recognition.onstart = () => {
            isRecording = true;
            micBtn.textContent = "🛑 Đang nghe... Hãy nói đi";
            micBtn.classList.add('recording');
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.textContent = "🎙️ Nhấn và Nói";
            micBtn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const studentSpeech = event.results[0][0].transcript;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message student-msg';
            msgDiv.textContent = studentSpeech;
            chatBox.appendChild(msgDiv);
            
            currentStep++;
            setTimeout(() => {
                showAssistantMessage();
            }, 1000);
        };

        recognition.onerror = (event) => {
            alert("Không nghe rõ, thầy/cô nhắc học sinh bấm nói lại nhé! Lỗi: " + event.error);
        };
    } else {
        alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome!");
    }

    window.onload = startConversation;
</script>

</body>
</html>
